services:
  sst-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    container_name: sst
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    stdin_open: true  # docker run -i
    tty: true        # docker run -t
    volumes:
      - ${SST_SRC_DIR:-./workspace}:/workspace